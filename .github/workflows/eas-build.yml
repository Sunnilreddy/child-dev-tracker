name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          npm install
          npm install -g eas-cli

      - name: Verify EAS token
        run: |
          if [ -z "$EAS_TOKEN" ]; then
            echo "ERROR: EAS_TOKEN is not set"
            exit 1
          fi
          echo "✓ EAS token is set"
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Build with EAS
        run: eas build --platform android --non-interactive --wait
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
